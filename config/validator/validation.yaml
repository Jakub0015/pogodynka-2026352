App\Entity\Location:
    constraints:
        - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity:
              fields: [name, country]
              message: 'Ta lokalizacja już istnieje.'
              groups: [create]
    properties:
        name:
            - NotBlank: { groups: [create, edit] }
            - Length: { min: 2, max: 100, groups: [create, edit] }
        country:
            - NotBlank: { groups: [create] }
        latitude:
            - NotBlank: { groups: [create] }
            - Range: { min: -90, max: 90, groups: [create, edit] }
        longitude:
            - NotBlank: { groups: [create] }
            - Range: { min: -180, max: 180, groups: [create, edit] }


App\Entity\Forecast:
    properties:
        location:
            - NotNull: { groups: [create, edit] }
        date:
            - NotNull: { groups: [create, edit] }
            - GreaterThanOrEqual: { value: today, message: 'Prognoza nie może dotyczyć przeszłości.', groups: [create] }
        temperature:
            - NotBlank: { groups: [create] }
            - Range: { min: -50, max: 50, groups: [create, edit] }
        humidity:
            - NotBlank: { groups: [create] }
            - Range: { min: 0, max: 100, groups: [create, edit] }
        precipitation:
            - PositiveOrZero: { groups: [create, edit] }
        wind:
            - PositiveOrZero: { groups: [create, edit] }
